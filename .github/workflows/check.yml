name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      BEND_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install Bend 2.0.39
        run: |
          curl -fsSL -o bend.tgz https://github.com/bendlang/bend/releases/download/v2.0.39/bend-2.0.39-linux-x64.tar.gz
          echo "6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab  bend.tgz" | sha256sum -c -
          tar xzf bend.tgz
          mkdir -p ~/.bend/bin && mv bend/bin/bend ~/.bend/bin/ && mv bend/bend2 bend/guide ~/.bend/
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      # `--verdict` builds the BendTT kernel on first use and needs this Lean.
      # elan v4.2.4 (tag v4.2.4, commit e9268f8b213e09a99768befe548049c046074225).
      # The release tarball is the installer. elan-init.sh on master is not
      # used: that script downloads whatever /releases/latest currently is.
      - name: Install Lean v4.34.0
        run: |
          curl -fsSL -o elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Proofs, verdict, build, fixture tests
        run: ./check.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Generated views match views.templ
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1070
          "$(go env GOPATH)/bin/templ" generate ./report
          git diff --exit-code -- report/views_templ.go
      - name: Go tests
        run: go test ./...
